name: Monitor active trades

on:
  repository_dispatch:
    types: [monitor_tick]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-engine
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Fetch enabled monitor state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 web_runtime/github_state.py fetch --output current-state.json
      - name: Evaluate all enabled trades
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET_CHAT_ID: ${{ secrets.TELEGRAM_TARGET_CHAT_ID }}
        run: python3 web_runtime/monitor.py --state current-state.json --output monitor-results.json
      - name: Persist decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 web_runtime/github_state.py monitor-results --results monitor-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-${{ github.run_id }}
          path: monitor-results.json
          retention-days: 7
      - name: Record monitor failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 web_runtime/github_state.py session-event --level error --message "❌ Falló una evaluación del monitor; se reintentará en el próximo tick"
